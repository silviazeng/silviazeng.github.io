<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Bluetooth LE works</title>
<meta name="description" content="An interactive 3D explainer of Bluetooth Low Energy: what is inside a pair of earbuds and a TV remote, how devices advertise, connect and exchange data, and why HDT matters.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=JetBrains+Mono:wght@500&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{
  /* Layout: one story, five acts. Top bar with device switch, act tabs, 3D stage (devices and radio waves), below it the shared timeline (air + chip current) and the chip block diagram, right column for narration, the hands-on control and terms. */
  --bg:#0a1019; --panel:#101926; --raise:#182436; --line:#293a54;
  --ink:#edf2f9; --ink2:#c1ccdc; --ink3:#94a3ba;
  --accent:#4aa8ff; --amber:#ffb84d; --green:#45d6a0; --violet:#b197fc; --red:#ff7a7a;
  --f-display:"Chakra Petch","Noto Sans",system-ui,sans-serif;
  --f-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
[hidden]{display:none!important}
h2,h3,h4,h5,p{margin:0}

#app{height:100%;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 408px;grid-template-rows:58px 64px minmax(0,1.06fr) minmax(0,1fr)}
@media (max-width:1380px){#app{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 372px}.stk button{grid-template-columns:112px minmax(0,1fr) max-content}}

#top{grid-column:1/-1;display:flex;align-items:center;gap:22px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.mark{display:flex;align-items:flex-end;gap:3px;height:22px}
.mark i{display:block;width:4px;background:var(--accent);border-radius:1px}
.mark i:nth-child(1){height:8px}.mark i:nth-child(2){height:14px}.mark i:nth-child(3){height:22px}
.brand b{font:600 19px/1 var(--f-display);letter-spacing:.03em;white-space:nowrap}
.devsw{display:flex;align-items:center;gap:10px;padding-left:22px;border-left:1px solid var(--line)}
.devsw span{font-size:14.5px;color:var(--ink3);white-space:nowrap}
#apxBtn{margin-left:auto;height:38px;padding:0 14px;background:transparent;border:1px solid var(--line);border-radius:4px;font-size:15px;color:var(--ink2);white-space:nowrap}
#apxBtn:hover{border-color:var(--accent);color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;padding:8px 14px;background:var(--bg);border:0;border-right:1px solid var(--line);font-size:15px;color:var(--ink2);line-height:1.3;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--accent);color:#06111f;font-weight:600}
.seg.wrap{flex-direction:column}.seg.wrap button{border-right:0;border-bottom:1px solid var(--line);text-align:left;padding:9px 12px}.seg.wrap button:last-child{border-bottom:0}

#acts{grid-column:1/-1;display:flex;gap:0;background:var(--panel);border-bottom:1px solid var(--line)}
#acts button{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:12px;padding:0 18px;background:transparent;border:0;border-right:1px solid var(--line);border-bottom:3px solid transparent;text-align:left;color:var(--ink2)}
#acts button:last-child{border-right:0}
#acts button i{font:500 15px/1 var(--f-mono);font-style:normal;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;color:var(--ink3);flex:0 0 auto}
#acts button b{display:block;font:600 17px/1.2 var(--f-display);letter-spacing:.03em;white-space:nowrap}
#acts button span{display:block;font-size:13.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#acts button:hover{background:var(--raise)}
#acts button.on{background:var(--raise);border-bottom-color:var(--accent);color:var(--ink)}
#acts button.on i{border-color:var(--accent);color:var(--accent)}
#acts button.done i{border-color:var(--green);color:var(--green)}

#stage{grid-column:1/3;grid-row:3;position:relative;min-height:0;overflow:hidden;user-select:none;-webkit-user-select:none;background:radial-gradient(110% 100% at 50% 30%,#172a43 0%,#0d1622 60%,var(--bg) 100%);border-bottom:1px solid var(--line)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}#gl.hit{cursor:pointer}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;display:none;white-space:nowrap;font:500 15px/1.25 var(--f-body);color:var(--ink);padding:3px 9px;border-radius:3px;background:rgba(10,16,25,.86);border:1px solid var(--line)}
button.lb{pointer-events:auto;cursor:pointer}
button.lb:hover{border-color:var(--ink);background:rgba(28,46,74,.97);z-index:2}
.lb.sel{border-color:var(--accent);background:rgba(18,40,70,.97);box-shadow:0 0 0 2px rgba(74,168,255,.4);z-index:3}
.lb.head{font:600 16px/1.25 var(--f-display);letter-spacing:.03em;background:rgba(16,25,38,.94)}
.lb.dev{border-color:var(--amber);color:var(--amber)}
.lb.peer{border-color:var(--accent);color:var(--accent)}
.lb.mark{border-style:dashed;color:var(--ink2);font-size:14px}
.lb.fly{font-size:14.5px;background:rgba(17,29,47,.97);z-index:4}
.lb.wifi{border-color:var(--violet);color:var(--violet)}
#ring{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid var(--accent);border-radius:50%;pointer-events:none;z-index:4}
#hud{position:absolute;left:14px;bottom:12px;padding:6px 14px 7px;background:rgba(10,16,25,.84);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:4px;max-width:58%;pointer-events:none}
#hud small{display:block;font-size:13px;color:var(--ink3);line-height:1.2}
#hud b{display:block;font:600 17px/1.35 var(--f-display);letter-spacing:.02em}
#stagectl{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;z-index:5}
#stagectl button{height:42px;padding:0 13px;background:rgba(24,36,54,.94);border:1px solid var(--line);border-radius:4px;font-size:15px;white-space:nowrap}
#stagectl button:hover{border-color:var(--accent)}
#xbox{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;background:rgba(24,36,54,.96);border:1px solid var(--amber);border-radius:4px;font-size:15px;color:var(--amber);white-space:nowrap}
#xbox input{width:190px;accent-color:var(--amber)}
#stage.hasinfo #hud{display:none}
#info{position:absolute;left:14px;bottom:12px;width:min(430px,calc(100% - 28px));padding:10px 14px 11px;background:rgba(17,29,47,.97);border:1px solid var(--accent);border-left:4px solid var(--accent);border-radius:5px;z-index:5}
#info b{display:block;font:600 17px/1.35 var(--f-display)}
#info p{font-size:15.5px;line-height:1.55;color:var(--ink2);margin-top:2px}
#nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--ink2)}

#lanes,#chip{grid-row:4;min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--panel);padding:10px 14px 10px;overflow:hidden}
#lanes{grid-column:1;border-right:1px solid var(--line)}
#chip{grid-column:2;overflow:auto}
#chip.flash{animation:cflash .9s ease-out}
@keyframes cflash{0%{box-shadow:inset 0 0 0 2px var(--accent)}100%{box-shadow:inset 0 0 0 2px transparent}}
.lh{display:flex;align-items:center;gap:14px;min-height:26px;margin-bottom:6px;flex-wrap:wrap}
.lh b{font:600 15.5px/1.2 var(--f-display);letter-spacing:.04em;color:var(--ink2);white-space:nowrap}
.lh em{margin-left:auto;font-style:normal;font-size:13.5px;color:var(--ink3);white-space:nowrap}
.lg{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.lg span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.lg i{width:12px;height:12px;border-radius:2px;display:block}
#laneTime{flex:1;min-height:0;display:flex;flex-direction:column}
#lc{flex:1;min-height:0;width:100%;display:block}
#laneAlt{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.alt-h{font:600 15.5px/1.3 var(--f-display);letter-spacing:.04em;color:var(--ink2)}
.cap{font-size:14.5px;color:var(--ink3);line-height:1.55}

/* protocol stack to hardware map */
.stk{display:flex;flex-direction:column;gap:3px}
.stk button{display:grid;grid-template-columns:150px minmax(0,1.1fr) minmax(0,1fr);gap:10px;align-items:center;padding:3px 10px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:3px;text-align:left;font-size:15px}
.stk button.ctl{border-left-color:var(--amber)}
.stk button.itf{border-left-color:var(--ink3)}
.stk button:hover,.stk button.on{background:var(--raise);border-color:var(--accent)}
.stk b{font-weight:600;white-space:nowrap}
.stk span{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk em{font-style:normal;color:var(--green);white-space:nowrap}

/* PHY comparison */
.cmp{display:flex;flex-direction:column;gap:6px}
.cmp .r{display:grid;grid-template-columns:168px minmax(60px,1fr) 116px 76px;gap:10px;align-items:center;font-size:15px;min-height:26px}
.cmp .r.h{font-size:13.5px;color:var(--ink3)}
.cmp .n{white-space:nowrap}
.cmp .n b{font-weight:600}
.cmp .n small{color:var(--ink3);font-size:13.5px;margin-left:8px}
.cmp .bar{height:18px;background:var(--bg);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.cmp .bar i{display:block;height:100%;min-width:3px;background:var(--accent)}
.cmp .r.hdt .bar i{background:var(--green)}
.cmp .r.over .bar i{background:var(--red)}
.cmp .v{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp .r.over .v{color:var(--red)}
.cmp .d{color:var(--ink2);font-size:14px;white-space:nowrap}
#modc{flex:1;min-height:120px;width:100%;display:block;background:#0b121d;border:1px solid var(--line);border-radius:4px}
.recap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:1;min-height:0}
.recap .rc{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--green);border-radius:4px}
.recap i{font:500 14px/1 var(--f-mono);font-style:normal;color:var(--green)}
.recap h4{font:600 17px/1.3 var(--f-display)}
.recap p{font-size:15px;color:var(--ink2);line-height:1.55;flex:1}
.recap button,.btn{align-self:flex-start;height:40px;padding:0 13px;background:var(--raise);border:1px solid var(--line);border-radius:4px;font-size:15px}
.recap button:hover,.btn:hover{border-color:var(--accent)}

/* chip diagram */
#chipBody{display:flex;flex-direction:column;gap:8px;min-height:0}
.chipwrap{display:flex;align-items:stretch;gap:0}
.blk{position:relative;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:4px 8px;background:var(--bg);border:1px solid var(--line);border-radius:4px;text-align:left;min-width:0;overflow:hidden;--h:0}
.blk::before{content:"";position:absolute;inset:0;background:var(--accent);opacity:calc(var(--h)*.5);pointer-events:none}
.blk b,.blk small{position:relative}
.blk b{font-weight:600;font-size:15px;line-height:1.25;white-space:nowrap}
.blk small{font-size:13px;color:var(--ink2);line-height:1.3;white-space:nowrap}
.blk:hover{border-color:var(--ink)}
.blk.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(74,168,255,.4)}
.antb{flex:0 0 78px;align-self:center;border-style:dashed;border-color:var(--amber);height:64px;align-items:center;text-align:center;padding:4px}
.feed{flex:0 0 12px;align-self:center;height:2px;background:var(--amber)}
.die{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:8px;background:#0d1520;border:2px solid #3a4c69;border-radius:6px}
.die .wide{grid-column:1/-1;flex-direction:row;align-items:baseline;gap:10px;justify-content:flex-start}
#chipState{font-size:14.5px;color:var(--ink3);padding:1px 10px;border:1px solid var(--line);border-radius:3px}
#chipState:empty{display:none}
#chipState.on{color:#06111f;background:var(--accent);border-color:var(--accent);font-weight:600}
#chipDesc{font-size:15px;color:var(--ink2);line-height:1.55}
#chipDesc b{color:var(--ink);font-weight:600}
.two{display:flex;align-items:center;gap:0;padding:4px 0}
.chipbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding:9px;background:#0d1520;border:2px solid #3a4c69;border-radius:6px}
.chipbox h5{font:600 15.5px/1.3 var(--f-display)}
.chipbox span{padding:5px 8px;background:var(--bg);border:1px solid var(--line);border-radius:3px;font-size:14.5px;color:var(--ink2);line-height:1.35}
.wire{flex:0 0 78px;text-align:center;border-top:3px solid var(--green);margin-top:22px;padding-top:4px}
.wire b{display:block;font:600 15px/1.2 var(--f-display);color:var(--green)}
.wire small{font-size:13px;color:var(--ink3)}
.antm{flex:0 0 66px;margin-left:10px;padding:10px 4px;border:1px dashed var(--amber);border-radius:4px;color:var(--amber);font-size:14px;text-align:center}

/* side column */
#side{grid-column:3;grid-row:3/5;display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-height:0}
#nar{padding:14px 16px 16px;background:var(--raise);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:5px}
.nar-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink3)}
#narAct{color:var(--accent);font-family:var(--f-display);font-weight:600;letter-spacing:.04em}
#narT{margin:6px 0 8px;font:600 22px/1.35 var(--f-display);letter-spacing:.01em;text-wrap:balance}
#narB{font-size:16.5px;line-height:1.65;color:var(--ink2)}
.nar-btn{display:flex;gap:8px;margin-top:14px}
.nar-btn button{flex:1;height:48px;padding:0 10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;font-size:16.5px}
.nar-btn button:hover{border-color:var(--accent)}
.nar-btn button:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.nar-btn .pri{flex:1.6;background:var(--accent);border-color:var(--accent);color:#06111f;font-weight:600}
.nar-btn .pri:hover{background:#74bcff}
#try{padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:5px;display:flex;flex-direction:column;gap:10px}
#try h3,#terms h3{font:600 15px/1 var(--f-display);letter-spacing:.08em;color:var(--ink3)}
#try h3{color:var(--amber)}
.ctl{display:flex;align-items:center;gap:10px;font-size:15.5px}
.ctl label{white-space:nowrap;color:var(--ink2)}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--amber);height:28px}
.ctl output{font:500 15px var(--f-mono);min-width:86px;text-align:right;font-variant-numeric:tabular-nums}
.rd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rd div{padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:4px}
.rd small{display:block;font-size:13.5px;color:var(--ink3);line-height:1.3}
.rd b{display:block;font:600 19px/1.35 var(--f-display);font-variant-numeric:tabular-nums}
.big{height:50px;padding:0 14px;background:var(--amber);border:1px solid var(--amber);border-radius:4px;font-size:16.5px;font-weight:600;color:#1b1304}
.big:hover{background:#ffc873}
.big.on{background:var(--bg);color:var(--amber)}
.row2{display:flex;gap:8px}.row2 .big{flex:1}
.status{font-size:15px;color:var(--ink2);line-height:1.5}
details{font-size:14.5px;color:var(--ink3);line-height:1.6}
summary{cursor:pointer;color:var(--ink2);padding:4px 0}
#terms{display:flex;flex-direction:column;gap:10px}
#terms dl{margin:0;display:flex;flex-direction:column;gap:9px}
#terms dt{font-weight:600;font-size:15.5px;color:var(--ink)}
#terms dd{margin:1px 0 0;font-size:15px;color:var(--ink2);line-height:1.55}

/* appendix */
#apx{position:fixed;inset:0;background:rgba(4,8,14,.72);z-index:50;display:flex;justify-content:flex-end}
.apx-in{width:min(760px,100%);height:100%;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line)}
.apx-h{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.apx-h b{font:600 19px/1 var(--f-display)}
.apx-h button{height:40px;padding:0 16px;background:var(--raise);border:1px solid var(--line);border-radius:4px}
.apx-b{flex:1;overflow:auto;padding:18px 20px 30px;display:flex;flex-direction:column;gap:22px}
.apx-b h4{font:600 17px/1.3 var(--f-display);margin-bottom:8px;color:var(--ink)}
.apx-b p{font-size:15.5px;color:var(--ink2);line-height:1.65}
.apx-b ol{margin:0;padding-left:22px;color:var(--ink2);font-size:15.5px;line-height:1.7}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--ink3);font-weight:500;font-size:14px}
td{color:var(--ink2)}
td:first-child{color:var(--ink);white-space:nowrap}
.src{font-size:14px;color:var(--ink3);line-height:1.65}

#player{display:contents}
#dock{display:none}
#navPos,.tn{display:none}
#mnote:empty{display:none}
@media (min-width:1021px) and (max-height:800px){
  #chip{padding:8px 14px}
  #chip .lh{margin-bottom:4px}
  .die{gap:4px;padding:6px}
  .blk{padding:2px 8px}
  .blk b{font-size:14.5px;line-height:1.2}
  .blk small{line-height:1.2}
  #chipBody{gap:6px}
  #chipDesc{font-size:14px;line-height:1.45}
}
@media (max-width:1020px){
  html,body{height:auto}
  body{overflow:visible}
  #app{height:auto;display:flex;flex-direction:column}
  #top{flex-wrap:wrap;padding:10px 14px;gap:8px 12px}
  .brand{flex:1 1 100%}.mark{display:none}
  .brand b{font-size:17px}
  .devsw{padding-left:0;border-left:0;flex:1}
  .devsw span{display:none}
  .seg button{padding:7px 12px}
  #apxBtn{margin-left:0;height:36px}
  .tw{display:none}.tn{display:inline}
  #acts{overflow-x:auto}
  #acts button{flex:0 0 auto;padding:9px 12px;gap:8px}
  #acts button span{display:none}
  #acts button i{width:26px;height:26px;font-size:14px}
  /* pinned player: scene with its controls right underneath */
  #player{display:block;order:1;position:sticky;top:0;z-index:30;background:var(--bg);box-shadow:0 6px 14px rgba(0,0,0,.45)}
  #stage{height:min(56vw,44vh);min-height:196px;border-bottom:0}
  #player.isopen #stage{height:min(74vw,50vh);min-height:240px}
  #gl{touch-action:pan-y}
  #hud{left:8px;bottom:8px;max-width:calc(100% - 128px);padding:4px 10px;border-left-width:3px}
  #hud small{display:none}
  #hud b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stagectl{right:8px;bottom:8px;gap:5px}
  #stagectl button{height:36px;padding:0 10px;font-size:14px}
  #dock{display:flex;flex-direction:column;gap:8px;padding:8px 12px 10px;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  #xbox{height:44px;width:100%}#xbox input{flex:1;width:auto;min-width:0}
  #info{position:static;width:auto;padding:7px 12px 8px;border-left-width:4px}
  #info b{font-size:16px}
  #info p{font-size:14.5px;line-height:1.5}

  '<div><h4>L2CAP and GATT discovery</h4><p>L2CAP handles segmentation and reassembly, retransmission and flow control, and encapsulation and scheduling. ATT runs on a fixed channel, CID 0x0004. GATT service discovery takes five operations: READ_BY_GROUP_TYPE finds services, READ_BY_TYPE finds included services, READ_BY_TYPE finds characteristics, FIND_INFO finds descriptors such as the CCCD, and READ_REQ and WRITE_REQ read and write values.</p></div>' +
  '<div><h4>Three stack implementations</h4><table><tr><th>Stack</th><th>Platform</th><th>Openness</th></tr><tr><td>BlueZ</td><td>Linux</td><td>Open source. bluetoothd in user space offers features over D‑Bus; the kernel holds L2CAP, HCI and SCO</td></tr><tr><td>Bluedroid</td><td>Android, since 4.2</td><td>Open source, originally Broadcom’s closed stack. Three layers: btif, bta and stack</td></tr><tr><td>SoftDevice</td><td>nRF microcontrollers</td><td>Closed source, API only. Setup takes four calls: ble_stack_init, gap_params_init, gatt_init and services_init</td></tr></table></div>' +
  '<div><h4>How the LE Audio specs are layered</h4><p>The core spec sits at the bottom; the Generic Audio Framework sits in the middle, with BAP, MCP, CCP, CSIP, MICP, VCP and CAP; the use case profiles TMAP, HAP and PBP sit on top. Other extensions include BLE IPv6 and Mesh.</p></div>' +
  '<p class="src">Based on a Chinese article walking through the Bluetooth LE software stack, <a href="https://mp.weixin.qq.com/s/nm93sc7RoyBgJKuI9VXraw" target="_blank" rel="noopener">《蓝牙 BLE 软件全栈解读》</a> by Zhang Dasheng (WeChat, September 4, 2026). Graphics are redrawn and the text is rewritten. The HDT status is updated from public Bluetooth SIG information (<a href="https://audioxpress.com/news/bluetooth-sig-adopts-high-data-throughput-setting-the-stage-for-standardized-lossless-wireless-audio" target="_blank" rel="noopener">coverage of the HDT adoption</a>). The chip diagram, currents and battery figures are generic illustrations. Updated November 24, 2026.</p>';
